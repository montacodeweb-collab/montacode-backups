# Programador de copias de Montacode.
# Cada noche abre el CMS con un Chrome sin pantalla (InfinityFree solo deja pasar navegadores) y avanza las copias
# pendientes: exporta las bases de datos y lanza el trabajador de archivos (backup.yml), igual que haría el
# administrador con el CMS abierto. Si alguna web lleva más de 36 h sin copia correcta, el flujo termina en error
# y GitHub te avisa por email.
name: Programador
run-name: Programador ${{ github.event_name == 'schedule' && 'automático' || 'manual' }}

on:
  schedule:
    - cron: '17 1 * * *'   # 02:17 (invierno) / 03:17 (verano) en Madrid: copias del día
    - cron: '43 6 * * *'   # 07:43 / 08:43: recoge lo que quedara pendiente y comprueba que todo está al día
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programador
  cancel-in-progress: false

jobs:
  programador:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Chrome
        run: |
          pip install --quiet --disable-pip-version-check playwright==1.48.0
          python -m playwright install --with-deps chromium >/dev/null
      - name: Avanzar copias
        env:
          ROBOT_URL: ${{ secrets.ROBOT_URL }}
          ROBOT_KEY: ${{ secrets.ROBOT_KEY }}
          MAX_MINUTES: '200'
        run: python programador.py
