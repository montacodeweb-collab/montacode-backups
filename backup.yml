# Trabajador de copias de Montacode. Lo lanza el CMS (workflow_dispatch); no hace nada por su cuenta.
# Los accesos llegan cifrados en «payload» y solo se descifran aquí con el secreto WORKER_PRIVATE_KEY.
name: Copia de seguridad
run-name: Copia ${{ inputs.run }}

on:
  workflow_dispatch:
    inputs:
      run:
        description: Número de copia (lo pone el CMS)
        required: true
        type: string
      payload:
        description: Datos cifrados (los pone el CMS)
        required: true
        type: string

permissions:
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar
        run: |
          pip install --quiet --disable-pip-version-check pynacl==1.5.0
          command -v mysqldump >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client >/dev/null)
      - name: Copiar
        env:
          WORKER_PRIVATE_KEY: ${{ secrets.WORKER_PRIVATE_KEY }}
          PAYLOAD: ${{ inputs.payload }}
          RUN_ID: ${{ inputs.run }}
        run: python backup_worker.py
